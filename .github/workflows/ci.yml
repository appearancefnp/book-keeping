name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite is known to hang on this branch (36 of 156 files, in tests/payroll/*).
    # Without this, a hang burns the 360-minute default instead of failing. Deciding
    # whether that hang is real and pre-existing is exactly what this job is for, so it
    # must fail loudly and quickly rather than time out silently.
    timeout-minutes: 30
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: bookkeeping
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U admin -d bookkeeping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ADMIN_DATABASE_URL: postgres://admin:admin@localhost:5433/bookkeeping
      DATABASE_URL: postgres://bookkeeping_app:app_pw@localhost:5433/bookkeeping
      WORKER_DATABASE_URL: postgres://bookkeeping_worker:worker_pw@localhost:5433/bookkeeping
      SUPERVISOR_DATABASE_URL: postgres://bookkeeping_supervisor:supervisor_pw@localhost:5433/bookkeeping
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm --prefix web ci
      - name: Apply migrations (fail fast on a broken migration)
        run: npm run migrate
      - name: Domain test suite
        run: npm test
      - name: Typecheck root
        run: npx tsc --noEmit
      - name: Typecheck web
        run: npm --prefix web exec tsc -- --noEmit
      - name: Build web
        run: npm --prefix web run build

  image:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
