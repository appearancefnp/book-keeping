services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:?ADMIN_DATABASE_URL is required}
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:?WORKER_DATABASE_URL is required}
      SUPERVISOR_DATABASE_URL: ${SUPERVISOR_DATABASE_URL:?SUPERVISOR_DATABASE_URL is required}
      BLOB_DIR: /app/.blob-store
      # Required so /api/cron/bank-sync (called by the bookkeeping-banksync.timer, not by
      # `npm run worker`) doesn't 401 unconditionally — see docs/RUNNING.md §4.6.
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is required — /api/cron/bank-sync 401s without it and nothing syncs bank feeds}
      GOCARDLESS_SECRET_ID: ${GOCARDLESS_SECRET_ID:-}
      GOCARDLESS_SECRET_KEY: ${GOCARDLESS_SECRET_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - blobdata:/app/.blob-store

  worker:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:?WORKER_DATABASE_URL is required}
      SUPERVISOR_DATABASE_URL: ${SUPERVISOR_DATABASE_URL:?SUPERVISOR_DATABASE_URL is required}
      BLOB_DIR: /app/.blob-store
    volumes:
      - blobdata:/app/.blob-store

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  blobdata:
  caddydata:
  caddyconfig:
